<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PITCH Sing Along</title>
<meta name="description" content="PITCHの曲を、流れる歌詞を見ながら一緒に歌えるページ。MVを再生すると、いま歌うところが光ります。">
<meta property="og:title" content="PITCH Sing Along — 歌詞を見ながら一緒に歌おう">
<meta property="og:description" content="動画を再生すると、いま歌うところが光ります。PITCHの5アルバム・全39曲。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://pitch-music.github.io/img/monsters.jpg">
<meta property="og:url" content="https://pitch-music.github.io/">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b12; --bg2:#16131d; --line:#2a2533; --ink:#f4f0f7; --muted:#9a92a6; --dim:#5d566a;
  --accent:#e0344a; --lyric:clamp(22px,5.4vw,34px);
  --font:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --display:"Bebas Neue","Futura","Avenir Next Condensed",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- 一覧 ---------- */
#home{max-width:980px;margin:0 auto;padding:28px 16px 56px}
.brand{font-family:var(--display);letter-spacing:.06em;font-size:15px;color:var(--muted)}
.hero{display:grid;grid-template-columns:132px 1fr;gap:18px;align-items:center;margin:14px 0 26px}
.hero img{width:132px;height:132px;border-radius:12px;object-fit:cover;box-shadow:0 10px 40px #e0344a33}
.hero h1{font-family:var(--display);font-size:clamp(46px,11vw,76px);line-height:.9;letter-spacing:.02em;font-weight:400}
.hero p{color:var(--muted);font-size:14px;line-height:1.7;margin-top:8px}
.how{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.7;color:#cfc8d8;margin-bottom:22px}
.how b{color:var(--ink)}
.top{font-size:clamp(30px,7.5vw,48px);line-height:1.25;font-weight:900;margin:16px 0 8px;letter-spacing:.01em}
.lead{color:var(--muted);font-size:15px;margin-bottom:18px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.alb{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:10px;text-decoration:none;background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;transition:transform .15s,border-color .15s}
.alb:hover{transform:translateY(-2px);border-color:var(--c)}
.alb img{width:96px;height:96px;border-radius:8px;object-fit:cover}
.alb .at{font-family:var(--display);font-size:30px;line-height:1;letter-spacing:.02em}
.alb .ad{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.alb .an{font-size:12px;color:var(--c);font-weight:700;margin-top:4px}
.back2{display:inline-block;text-decoration:none}
.hero h1.long{font-size:clamp(34px,8vw,56px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{position:relative;display:block;text-decoration:none;background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--c)}
.card .th{aspect-ratio:16/9;background:#000 center/cover no-repeat}
.card .meta{padding:10px 12px 12px;border-top:3px solid var(--c)}
.card .no{font-family:var(--display);color:var(--c);font-size:15px;letter-spacing:.08em}
.card .tt{font-family:var(--display);font-size:28px;line-height:1;letter-spacing:.02em}
.card .hk{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);text-decoration:none;font-size:14px;font-weight:700}
.pill.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
footer{color:var(--dim);font-size:12px;line-height:1.7;margin-top:30px}

/* ---------- 歌う画面 ---------- */
#sing{display:none;height:100dvh;flex-direction:column}
body.singing #home{display:none}
body.singing #sing{display:flex}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--bg)}
.bar .back{font-size:14px;color:var(--muted);padding:6px 4px;white-space:nowrap}
.bar .now{flex:1;min-width:0;text-align:center}
.bar .now .tt{font-family:var(--display);font-size:24px;line-height:1;letter-spacing:.03em;color:var(--accent)}
.bar .now .hk{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:2px}
.nav button{width:36px;height:36px;border-radius:8px;font-size:18px;color:var(--muted)}
.nav button:hover{background:var(--bg2);color:var(--ink)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column}
.video{background:#000;flex:none}
.video .frame{position:relative;aspect-ratio:16/9;max-height:38dvh;margin:0 auto}
.video .frame>*{position:absolute;inset:0;width:100%;height:100%;border:0}
.tools{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.tools .grp{display:flex;align-items:center;gap:2px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:2px}
.tools button{min-width:30px;height:28px;border-radius:999px;padding:0 8px;font-size:13px}
.tools button:hover{background:var(--line);color:var(--ink)}
.tools .val{min-width:44px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.tools .lbl{padding:0 4px 0 8px}

.lyrics{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:30dvh 18px 45dvh;scroll-behavior:auto;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 82%,transparent)}
.ln{font-size:var(--lyric);font-weight:700;line-height:1.45;padding:.28em 0;color:var(--dim);transition:color .25s,transform .25s,opacity .25s;transform-origin:left center;cursor:pointer;max-width:880px;margin:0 auto;position:relative}
.ln:hover{color:var(--muted)}
.ln.past{color:#433d4e}
.ln.next{color:var(--muted)}
.ln.cur{color:var(--ink);transform:scale(1.04)}
.ln.cur .tx{background:linear-gradient(90deg,var(--accent) 0,var(--accent) var(--p,0%),var(--ink) var(--p,0%));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--accent) 35%,transparent))}
.ln .cd{display:none;position:absolute;left:0;top:-.15em;font-size:.42em;letter-spacing:.3em;color:var(--accent)}
.ln.soon .cd{display:block}
.gap{height:.9em;max-width:880px;margin:0 auto;color:#433d4e;font-size:calc(var(--lyric)*.6)}
.end{max-width:880px;margin:2em auto 0;color:var(--muted);font-size:15px;line-height:1.8}
.end a{color:var(--accent);font-weight:700}
.hint{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;padding:9px 16px;border-radius:999px;box-shadow:0 8px 30px #0008;opacity:0;pointer-events:none;transition:opacity .3s}
.hint.show{opacity:1;pointer-events:auto}

@media (min-width:960px){
  .stage{flex-direction:row}
  .video{width:48%;display:flex;flex-direction:column;justify-content:center;padding:20px;background:var(--bg);border-right:1px solid var(--line)}
  .video .frame{width:100%;max-height:none;border-radius:10px;overflow:hidden}
  .side{flex:1;min-width:0;display:flex;flex-direction:column}
  .lyrics{padding-left:40px;padding-right:40px}
}
@media (max-width:959px){ .side{flex:1;min-height:0;display:flex;flex-direction:column} }
@media (max-width:560px){
  .grid{grid-template-columns:1fr;gap:8px}
  .card{display:grid;grid-template-columns:132px 1fr;align-items:stretch}
  .card .th{height:100%;min-height:74px}
  .card .meta{border-top:0;border-left:3px solid var(--c);padding:6px 10px;display:flex;flex-direction:column;justify-content:center}
  .card .tt{font-size:23px}
  .card .hk{font-size:12px;margin-top:2px}
  .card .no{font-size:13px}
}
@media (max-width:520px){
  .hero{grid-template-columns:92px 1fr;gap:14px}
  .hero img{width:92px;height:92px}
  .tools .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){ .ln,.card{transition:none} .ln.cur{transform:none} }
</style>
</head>

<main id="home"></main>

</section>

const COUNT_IN = 3;         // 間奏明けのカウント(秒)

const $ = s => document.querySelector(s);
const store = {
  get(k,d){ try{ const v=localStorage.getItem("pitch-sing:"+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },

const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FOOT = `<footer>© 2026 PITCH ／ 楽曲・ボーカルはAI(Musicful)、作詞はPITCH×Claudeで制作しています。動画はYouTubeから再生しています。</footer>`;
const HOW = `<div class="how">曲を選んで<b>動画を再生</b>すると、<b>いま歌うところ</b>が光って流れます。行をタップするとそこから再生。歌詞が早い・遅いと感じたら「歌詞のタイミング」で合わせてください。</div>`;

// ---------- 歌う画面 ----------
let player=null, apiReady=false, album=null, ti=-1, rows=[], cur=-2, userScrollUntil=0, pendingAutoplay=false;
let offset = store.get("offset",0), fs = store.get("fs",0);

function applyFs(){ document.documentElement.style.setProperty("--lyric",`calc(clamp(22px,5.4vw,34px) * ${(1+fs*0.12).toFixed(2)})`); }
function applyOff(){ $("#offVal").textContent=(offset>0?"+":offset<0?"−":"±")+Math.abs(offset).toFixed(1); }

function openTrack(a, i, autoplay){
  album=a; ti=i; const t=a.tracks[i];
  document.body.classList.add("singing");
  document.documentElement.style.setProperty("--accent",t.color);
  document.title=`${t.title} — PITCH Sing Along`;
  $("#nowTitle").textContent=t.title; $("#nowHook").textContent=t.hook;
  $("#backLink").href="#"+a.slug;
  buildLyrics(t);
  pendingAutoplay=!!autoplay;
  if(player && player.loadVideoById){ autoplay ? player.loadVideoById(t.yt) : player.cueVideoById(t.yt); }
  else ensurePlayer();
}

function buildLyrics(t){
  const box=$("#lyrics"); box.innerHTML=""; rows=[]; cur=-2;
  const L=t.lines;
  L.forEach((l,k)=>{
    const end = k+1<L.length ? L[k+1][0] : l[0]+6;
    if(!l[1]){ if(k>0 && k<L.length-1){ const g=document.createElement("div"); g.className="gap"; g.setAttribute("aria-hidden","true"); box.appendChild(g);} return; }
    const d=document.createElement("div"); d.className="ln";
    d.innerHTML='<span class="cd"></span><span class="tx"></span>';
    d.querySelector(".tx").textContent=l[1];
    d.addEventListener("click",()=>{ if(player&&player.seekTo){ player.seekTo(Math.max(0,l[0]-0.6-offset),true); player.playVideo(); userScrollUntil=0; } });
    box.appendChild(d);
    rows.push({s:l[0], e:end, el:d});
  });
  const nx = album.tracks[ti+1];
  const end=document.createElement("div"); end.className="end";
  end.innerHTML = nx ? `おつかれさま！ 次は <a href="#${album.slug}/${nx.slug}"></a>` : (album.link?`全${album.tracks.length}曲おつかれさま！ <a href="${album.link}" target="_blank" rel="noopener">配信でも聴いてね</a>`:`全${album.tracks.length}曲おつかれさま！ <a href="#">ほかのアルバムも歌う ›</a>`);
  if(nx) end.querySelector("a").textContent=nx.title+" ›";
  box.appendChild(end);
  box.scrollTop=0;
}

function tick(){
  requestAnimationFrame(tick);
  if(!player || !player.getCurrentTime || !rows.length) return;
  const t = player.getCurrentTime() + LEAD + offset;
  // いまの行 = 始まっていて、まだ終わっていない行
  let idx=-1, last=-1;
  for(let k=0;k<rows.length;k++){ if(rows[k].s<=t){ last=k; if(t<rows[k].e) idx=k; } else break; }
  const nextK = last+1 < rows.length ? last+1 : -1;
  if(idx!==cur){
    rows.forEach((r,k)=>{ r.el.classList.toggle("cur",k===idx); r.el.classList.toggle("past",k<=last && k!==idx); r.el.classList.toggle("next",k===nextK); if(k!==idx) r.el.style.removeProperty("--p"); });
    cur=idx;
    follow(idx>=0?idx:nextK);
  }
  if(idx>=0){ const r=rows[idx]; const p=Math.min(1,(t-r.s)/Math.max(0.6,(r.e-r.s)*0.92)); r.el.style.setProperty("--p",(p*100).toFixed(1)+"%"); }
  // 間奏明けのカウント
  rows.forEach(r=>r.el.classList.remove("soon"));
  if(idx<0 && nextK>=0){ const left=rows[nextK].s-t; if(left>0 && left<=COUNT_IN){ const n=Math.ceil(left); const r=rows[nextK]; r.el.classList.add("soon"); r.el.querySelector(".cd").textContent="●".repeat(n); } }
}

function follow(k){
  if(k<0 || Date.now()<userScrollUntil) return;
  const box=$("#lyrics"), el=rows[k].el;
  const target = el.offsetTop - box.clientHeight*0.36 + el.offsetHeight/2;
  box.scrollTo({top:target, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  $("#hint").classList.remove("show");
}

function ensurePlayer(){
  if(!apiReady){ return; }
  if(player) return;
  const t=album.tracks[ti];
  player = new YT.Player("player",{
    videoId:t.yt,
    playerVars:{playsinline:1, rel:0, modestbranding:1, autoplay: pendingAutoplay?1:0},
    events:{
      onReady:()=>{ if(pendingAutoplay) player.playVideo(); },
      onStateChange:e=>{ if(e.data===YT.PlayerState.ENDED && ti+1<album.tracks.length){ location.hash=`#${album.slug}/${album.tracks[ti+1].slug}`; pendingNextAuto=true; } }
    }
  });
}
let pendingNextAuto=false;
window.onYouTubeIframeAPIReady = ()=>{ apiReady=true; if(album) ensurePlayer(); };

// 手でスクロールしたら少しのあいだ自動スクロールを止める
["wheel","touchmove"].forEach(ev=>$("#lyrics").addEventListener(ev,()=>{ userScrollUntil=Date.now()+5000; $("#hint").classList.add("show"); },{passive:true}));
$("#hint").addEventListener("click",()=>{ userScrollUntil=0; const k=cur>=0?cur:rows.findIndex(r=>r.el.classList.contains("next")); if(k>=0) follow(k); });

$("#fsUp").onclick=()=>{ fs=Math.min(4,fs+1); store.set("fs",fs); applyFs(); };
$("#fsDown").onclick=()=>{ fs=Math.max(-2,fs-1); store.set("fs",fs); applyFs(); };
$("#offUp").onclick=()=>{ offset=Math.round((offset+0.1)*10)/10; store.set("offset",offset); applyOff(); cur=-2; };
$("#offDown").onclick=()=>{ offset=Math.round((offset-0.1)*10)/10; store.set("offset",offset); applyOff(); cur=-2; };
$("#prev").onclick=()=>{ if(ti>0) location.hash=`#${album.slug}/${album.tracks[ti-1].slug}`; };
$("#next").onclick=()=>{ if(ti+1<album.tracks.length){ pendingNextAuto=true; location.hash=`#${album.slug}/${album.tracks[ti+1].slug}`; } };

function route(){
  const [as,ts]=location.hash.replace(/^#/,"").split("/");
  const a=ALBUMS.find(x=>x.slug===as), i=a?a.tracks.findIndex(t=>t.slug===ts):-1;
  if(a && i>=0){ const auto=pendingNextAuto; pendingNextAuto=false; openTrack(a,i,auto); return; }
  document.body.classList.remove("singing"); if(player&&player.pauseVideo) player.pauseVideo();
  if(a){ renderAlbum(a); document.title=`${a.title} — PITCH Sing Along`; document.documentElement.style.setProperty("--accent",a.color||a.tracks[0].color); }
  else { renderHome(); document.title="PITCH Sing Along"; }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
document.addEventListener("keydown",e=>{ if(e.target.closest("input,textarea")||!document.body.classList.contains("singing")||!player||!player.getPlayerState) return;
  if(e.code==="Space"){ e.preventDefault(); player.getPlayerState()===1?player.pauseVideo():player.playVideo(); } });

applyFs(); applyOff(); route(); requestAnimationFrame(tick);
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
